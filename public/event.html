<script type="module">
document.addEventListener("DOMContentLoaded", async () => {
  try {
    await import("./assets/site-data.js?v=202610281625");
  } catch (err) {
    console.error("site-data.js failed to load:", err);
    return;
  }
  const id = new URLSearchParams(location.search).get("id");
  const events = await window.LPData.loadEvents().catch(() => []);
  const e = events.find(x => String(x.id) === String(id)) || events[0];
  const box = document.getElementById("eventDetail");
  if (!e) { box.innerHTML = '<p class="meta" style="text-align:center;padding:40px 0">האירוע לא נמצא או שכבר הסתיים.</p>'; return; }
  const reg = lpRegisterLink(e);
  box.innerHTML = `
    <h1>${escapeHtml(e.title)}</h1>
    <div class="two-col">
      <div>
        <div class="cover" style="background-image:url('${escapeHtml(e.img||"")}')"></div>
        ${e.category ? `<div class="eyebrow">${escapeHtml(e.category)}</div>` : ""}
        <p>${escapeHtml(e.desc || "")}</p>
        <h3>לפני שמגיעים</h3>
        <p>האירוע מיועד לבני 18 ומעלה. ההרשמה בוואטסאפ, מול אבי. פרטי הגעה מלאים יימסרו לרשומים.</p>
      </div>
      <aside class="panel" style="align-self:start;margin-top:20px">
        <h3>כל מה שצריך לדעת</h3>
        ${(e.day || e.date) ? `<div class="row"><span>תאריך</span><b>${escapeHtml(e.day||"")}${e.day && e.date ? ", " : ""}${escapeHtml(e.date||"")}</b></div>` : ""}
        ${e.time ? `<div class="row"><span>שעה</span><span>${escapeHtml(e.time)}</span></div>` : ""}
        ${e.dj ? `<div class="row"><span>DJ</span><span>${escapeHtml(e.dj)}</span></div>` : ""}
        <a class="btn gold full" href="${escapeHtml(reg.href)}" target="_blank" rel="noopener noreferrer">${reg.label}</a>
        <p class="meta">ההרשמה בוואטסאפ בלבד, מול אבי. אין תשלום אונליין.</p>
      </aside>
    </div>
  `;
  lpFrameCoverImage(box, e.img, e.title);
});
</script>
